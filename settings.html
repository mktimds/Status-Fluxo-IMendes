<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div id="content">
    <p class="sf-muted" style="margin:0 0 8px">Status deste quadro, na ordem do fluxo. Em cada um, escolha a lista (coluna do responsável) para onde o card vai ao receber o status.</p>
    <div id="keywarn"></div>
    <div id="rows"></div>
    <div class="sf-actions">
      <button id="add">+ Adicionar status</button>
    </div>
    <div class="sf-field">
      <label for="pos">Ao mover, colocar o card</label>
      <select id="pos">
        <option value="top">No topo da lista</option>
        <option value="bottom">No final da lista</option>
      </select>
    </div>
    <div class="sf-actions">
      <button id="save" class="mod-primary">Salvar</button>
      <button id="reset">Restaurar padrão</button>
    </div>
    <div id="error" class="sf-error"></div>
    <p id="count" class="sf-muted"></p>
    <div id="auth"></div>
  </div>
  <script src="./common.js"></script>
  <script>
    var t = sfIframe();
    var list = [], boardLists = [];
    var $rows = document.getElementById('rows');
    var $err = document.getElementById('error');
    var $pos = document.getElementById('pos');

    function colorOptions(sel) {
      return Object.keys(SF_COLORS).map(function (k) {
        return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + SF_COLORS[k].label + '</option>';
      }).join('');
    }

    function listOptions(sel) {
      var html = '<option value="">Não mover</option>';
      var found = !sel;
      boardLists.forEach(function (l) {
        if (l.id === sel) found = true;
        html += '<option value="' + l.id + '"' + (l.id === sel ? ' selected' : '') + '>' + sfEsc(l.name) + '</option>';
      });
      if (!found) html += '<option value="' + sfEsc(sel) + '" selected>(lista arquivada/removida)</option>';
      return html;
    }

    function render() {
      $rows.innerHTML = '';
      list.forEach(function (s, i) {
        var item = document.createElement('div');
        item.className = 'sf-item';
        item.innerHTML =
          '<div class="sf-row">' +
            '<span class="sf-dot" style="background:' + sfHex(s.color) + '"></span>' +
            '<input type="text" maxlength="40" value="' + sfEsc(s.name) + '" placeholder="Nome do status">' +
            '<select class="sf-color" title="Cor">' + colorOptions(s.color) + '</select>' +
          '</div>' +
          '<div class="sf-row">' +
            '<span class="sf-arrow" title="Mover para a lista">→</span>' +
            '<select class="sf-list-sel" title="Mover o card para esta lista"' + (sfKeyOk() ? '' : ' disabled') + '>' +
              listOptions(s.list) + '</select>' +
            '<button class="sf-icon-btn" title="Subir"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
            '<button class="sf-icon-btn" title="Descer"' + (i === list.length - 1 ? ' disabled' : '') + '>↓</button>' +
            '<button class="sf-icon-btn" title="Excluir">✕</button>' +
          '</div>';
        var inp = item.querySelector('input');
        var col = item.querySelector('.sf-color');
        var dest = item.querySelector('.sf-list-sel');
        var btns = item.querySelectorAll('button');
        inp.addEventListener('input', function () { s.name = inp.value; updateCount(); });
        col.addEventListener('change', function () { s.color = col.value; render(); });
        dest.addEventListener('change', function () { s.list = dest.value || undefined; updateCount(); });
        btns[0].addEventListener('click', function () { move(i, -1); });
        btns[1].addEventListener('click', function () { move(i, 1); });
        btns[2].addEventListener('click', function () {
          if (confirm('Excluir "' + (s.name || 'status') + '"? Cards com esse status ficarão sem status.')) {
            list.splice(i, 1); render();
          }
        });
        $rows.appendChild(item);
      });
      updateCount();
      t.sizeTo('#content');
    }

    function move(i, d) {
      var j = i + d;
      if (j < 0 || j >= list.length) return;
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      render();
    }

    function clean() {
      return list.map(function (s) {
        var o = { id: s.id, name: s.name.trim(), color: s.color };
        if (s.list) o.list = s.list;
        return o;
      });
    }

    function payloadSize() {
      return JSON.stringify({ statuses: clean(), movePos: $pos.value }).length;
    }

    function updateCount() {
      document.getElementById('count').textContent =
        list.length + ' status · ' + Math.round(payloadSize() / SF_MAX_CHARS * 100) + '% do espaço usado';
    }

    function renderAuth() {
      var $a = document.getElementById('auth');
      if (!sfKeyOk()) {
        document.getElementById('keywarn').innerHTML =
          '<div class="sf-box">Movimentação automática desativada: cole a API key do Power-Up no arquivo <strong>common.js</strong>.</div>';
        return;
      }
      sfGetToken(t).then(function (tok) {
        $a.innerHTML = tok
          ? '<div class="sf-box is-ok">Você autorizou a movimentação automática ✓<br><button id="disc">Desconectar</button></div>'
          : '<div class="sf-box">Você ainda não autorizou a movimentação automática (cada pessoa autoriza uma vez).<br><button id="doauth" class="mod-primary">Autorizar agora</button></div>';
        var d = document.getElementById('disc'), a = document.getElementById('doauth');
        if (d) d.addEventListener('click', function () { sfClearToken(t).then(renderAuth); });
        if (a) a.addEventListener('click', function () {
          sfAuthorize(t).then(renderAuth).catch(function () {
            $err.textContent = 'Autorização cancelada ou bloqueada pelo navegador.';
          });
        });
        t.sizeTo('#content');
      });
    }

    $pos.addEventListener('change', updateCount);

    document.getElementById('add').addEventListener('click', function () {
      var keys = Object.keys(SF_COLORS);
      list.push({ id: sfUid(), name: '', color: keys[list.length % keys.length] });
      render();
      var inputs = $rows.querySelectorAll('input');
      inputs[inputs.length - 1].focus();
    });

    document.getElementById('reset').addEventListener('click', function () {
      if (confirm('Voltar para os status padrão? (Só é aplicado ao clicar em Salvar.)')) {
        list = SF_DEFAULT_STATUSES.map(function (s) { return Object.assign({}, s); });
        render();
      }
    });

    document.getElementById('save').addEventListener('click', function () {
      var data = clean();
      $err.textContent = '';
      if (!data.length) { $err.textContent = 'Crie pelo menos um status.'; return; }
      if (data.some(function (s) { return !s.name; })) { $err.textContent = 'Preencha o nome de todos os status.'; return; }
      var names = data.map(function (s) { return s.name.toLowerCase(); });
      if (names.some(function (n, i) { return names.indexOf(n) !== i; })) { $err.textContent = 'Há status com nomes repetidos.'; return; }
      if (payloadSize() > SF_MAX_CHARS) { $err.textContent = 'Limite de espaço do Trello atingido. Encurte nomes ou remova status.'; return; }
      t.set('board', 'shared', { statuses: data, movePos: $pos.value }).then(function () { t.closePopup(); });
    });

    t.render(function () {
      return TrelloPowerUp.Promise.all([
        sfGetStatuses(t),
        t.lists('id', 'name'),
        t.get('board', 'shared', 'movePos', 'top')
      ]).then(function (r) {
        list = r[0].map(function (x) { return Object.assign({}, x); });
        boardLists = r[1];
        $pos.value = r[2] === 'bottom' ? 'bottom' : 'top';
        render();
        renderAuth();
      });
    });
  </script>
</body>
</html>
